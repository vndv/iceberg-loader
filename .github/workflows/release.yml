name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev --all-extras
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github --extend-exclude 'examples'
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest --cov=iceberg_loader --cov=tests --cov-report=xml

  examples-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: release-examples
          version: "latest"
          python-version: "3.12"
      - name: Install deps
        run: uv sync --group dev --all-extras
      - name: Start Docker-backed example smoke suite
        run: bash tools/run_examples_smoke.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f examples/docker-compose.yml logs --no-color
      - name: Tear down example stack
        if: always()
        run: docker compose -f examples/docker-compose.yml down -v

  build-and-publish:
    needs: [tests, examples-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
          version: "latest"
          python-version: "3.14"

      - name: Install deps
        run: uv sync --group dev --all-extras

      - name: Build sdist and wheel
        run: uv build

      - name: Twine check
        run: uv run twine check dist/*

      - name: Install built artifacts (smoke)
        run: |
          python -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install dist/*.whl
          python - <<'PY'
          from iceberg_loader import __version__
          print(__version__)
          PY

      - name: Publish to TestPyPI (optional)
        if: env.TEST_PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.TEST_PYPI_API_TOKEN }}
        run: uv run twine upload --repository testpypi dist/*

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: uv run twine upload dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
